openapi: 3.0.3
info:
  title: Portfolio Intelligence API
  version: 0.1.0
paths:
  /api/v1/analytics/portfolios/{portfolio_id}/:
    get:
      operationId: portfolio_analytics
      description: Return owned-portfolio performance/risk analytics for an inclusive-start,
        exclusive-end trading-session period.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: minimum_acceptable_return_annual
        schema:
          type: number
          format: double
          default: 0.0
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: risk_free_rate_annual
        schema:
          type: number
          format: double
          default: 0.0
      - in: query
        name: rolling_window
        schema:
          type: integer
          minimum: 1
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - analytics
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioAnalyticsResult'
          description: Owned-portfolio analytical result and provenance.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Query or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider or analytics dependency is unavailable.
  /api/v1/assets/:
    get:
      operationId: asset_catalog_list
      description: List active canonical USD stock/ETF identities available for transaction
        entry. This endpoint performs no provider lookup.
      tags:
      - assets
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetCatalogItem'
          description: Active canonical asset identities.
  /api/v1/assets/resolve/:
    post:
      operationId: asset_catalog_resolve
      description: Resolve user-entered symbols through the canonical provider-neutral
        asset boundary. Unresolved symbols may be discovered through the configured
        safe provider adapter and persisted as supported canonical USD stock/ETF identities.
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetResolveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetResolveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetResolveRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResolveResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: Authenticate an email/password identity and establish a Django
        session. A valid CSRF token from GET /api/v1/auth/session/ is required.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResult'
          description: Authenticated browser-session state.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthValidationError'
          description: Email/password request validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiError'
          description: The supplied email/password pair is invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiError'
          description: CSRF validation failed.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: Destroy the current Django session. A valid session and CSRF token
        are required.
      tags:
      - auth
      security:
      - csrfDeferredCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResult'
          description: Anonymous browser-session state after logout.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiError'
          description: No authenticated session is present.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiError'
          description: Authentication or CSRF validation failed.
  /api/v1/auth/session/:
    get:
      operationId: auth_session
      description: Return the current Django browser-session state and issue the CSRF
        cookie required by login/logout POST requests.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResult'
          description: Current authenticated or anonymous session state.
  /api/v1/health/:
    get:
      operationId: health_check
      description: Return a lightweight application-health response.
      tags:
      - system
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/v1/market-data/bars/query/:
    post:
      operationId: market_data_bars_query
      description: Resolve symbols and return bounded canonical daily market bars.
      tags:
      - market-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketBarQuery'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarketBarQuery'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarketBarQuery'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBarBatchResult'
          description: The provider completed the request. Inspect each ordered symbol
            result for SUCCEEDED, NOT_FOUND, NO_DATA, or FAILED.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBarValidationError'
          description: Request or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBarApiError'
          description: The authenticated user is not authorized to request the selected
            non-default provider.
        '429':
          description: The market-bar query throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBarApiError'
          description: The configured provider was unavailable or could not be attempted.
  /api/v1/optimization-runs/:
    get:
      operationId: optimization_run_list
      description: List optimization runs owned by the authenticated user.
      tags:
      - optimization
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OptimizationRun'
          description: ''
    post:
      operationId: optimization_run_create
      description: Create and synchronously execute one persisted historical optimization
        run from either an owned portfolio or an explicit ad hoc canonical asset universe.
        Failed domain/solver executions remain auditable as FAILED run resources.
      tags:
      - optimization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizationRunCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OptimizationRunCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OptimizationRunCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationRun'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationValidationError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationApiError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationApiError'
          description: ''
  /api/v1/optimization-runs/{run_id}/:
    get:
      operationId: optimization_run_detail
      description: Return one optimization run owned by the authenticated user.
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - optimization
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationRun'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationApiError'
          description: Run does not exist in the authenticated user's scope.
  /api/v1/portfolios/:
    get:
      operationId: portfolio_list
      description: List portfolios owned by the authenticated user.
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioSummary'
          description: Owned portfolio summaries.
    post:
      operationId: portfolio_create
      description: Create one USD portfolio owned by the authenticated user. Ownership
        is derived exclusively from the authenticated session.
      tags:
      - portfolios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PortfolioCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PortfolioCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
          description: Created owned portfolio.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Portfolio name validation failed.
  /api/v1/portfolios/{portfolio_id}/:
    get:
      operationId: portfolio_detail
      description: Return one portfolio owned by the authenticated user.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
          description: Owned portfolio summary.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
    patch:
      operationId: portfolio_rename
      description: Rename one portfolio owned by the authenticated user.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - portfolios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPortfolioRenameRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPortfolioRenameRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPortfolioRenameRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
          description: Renamed owned portfolio.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Portfolio name validation failed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
    delete:
      operationId: portfolio_delete
      description: Permanently delete one owned portfolio only when it has no persisted
        transaction or analytical history.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: Empty owned portfolio permanently deleted.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: Permanent deletion is blocked because retained transaction
            or analytical history exists.
  /api/v1/portfolios/{portfolio_id}/allocation/:
    get:
      operationId: portfolio_dashboard_allocation
      description: Return the P0 current portfolio asset-class allocation using authoritative
        valuation/allocation weights, explicit cash, deterministic ordering, and disclosed
        grouping rules.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAllocationResult'
          description: Dashboard-ready current allocation.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider, calendar, valuation, or allocation dependency
            failed.
  /api/v1/portfolios/{portfolio_id}/benchmark/:
    patch:
      operationId: portfolio_benchmark_update
      description: Select or clear the benchmark for one authenticated-user-owned
        portfolio using an active canonical USD stock/ETF asset identity.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - portfolios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPortfolioBenchmarkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPortfolioBenchmarkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPortfolioBenchmarkRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
          description: Owned portfolio with updated benchmark selection.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Benchmark asset identity is invalid or unsupported.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
  /api/v1/portfolios/{portfolio_id}/dashboard/:
    get:
      operationId: portfolio_dashboard_snapshot
      description: Return one coherent owner-scoped dashboard snapshot using a shared
        provider, calculation cutoff, trading-session range, and request-local market-data
        query cache. Individual dashboard modules may be unavailable without failing
        the complete response.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: minimum_acceptable_return_annual
        schema:
          type: number
          format: double
          default: 0.0
      - in: query
        name: movers_limit
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 5
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: risk_free_rate_annual
        schema:
          type: number
          format: double
          default: 0.0
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSnapshotResult'
          description: Canonical dashboard snapshot and module states.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Range, assumptions, or provider validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A shared dashboard dependency or snapshot context is unavailable.
  /api/v1/portfolios/{portfolio_id}/holdings/:
    get:
      operationId: portfolio_current_holdings
      description: Return ledger-derived current holdings, raw-close valuation, allocation,
        warnings, and provenance for an owned portfolio.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPortfolioHoldings'
          description: Current holdings and valuation result.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Query or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider or valuation dependency is unavailable.
  /api/v1/portfolios/{portfolio_id}/holdings/dashboard/:
    get:
      operationId: portfolio_dashboard_holdings
      description: Return display-ready current holdings with exact-date selected-period
        adjusted-close movement and non-interpolated sparkline points.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardHoldingsResult'
          description: Dashboard-ready owned-portfolio holdings.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Date-range or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider, calendar, valuation, or history dependency
            failed.
  /api/v1/portfolios/{portfolio_id}/movers/:
    get:
      operationId: portfolio_dashboard_movers
      description: Return deterministic selected-period Top Gainers, Top Losers, Largest
        Contributors, and Largest Detractors. Contribution rankings reconcile to canonical
        portfolio TWR and include explicit residual attribution metadata.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 5
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMoversResult'
          description: Dashboard-ready mover and contribution rankings.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Date-range, limit, or provider validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider, calendar, valuation, history, or attribution
            dependency failed.
  /api/v1/portfolios/{portfolio_id}/performance/:
    get:
      operationId: portfolio_performance
      description: Return display-ready daily portfolio value/TWR points and an optional
