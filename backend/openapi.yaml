          description: Persisted portfolio transaction history, newest first.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
    post:
      operationId: portfolio_transaction_create
      description: Create one canonical owned-portfolio ledger transaction and replay
        the authoritative long-only ledger before commit.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioTransactionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PortfolioTransactionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PortfolioTransactionCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioTransaction'
          description: Persisted canonical transaction.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionWriteValidationError'
          description: Transaction input or ledger replay validation failed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
  /api/v1/portfolios/{portfolio_id}/transactions/import/confirm/:
    post:
