  /api/v1/portfolios/{portfolio_id}/transactions/:
    get:
      operationId: portfolio_transaction_list
      description: List every persisted transaction in one authenticated-user-owned
        portfolio in reverse deterministic ledger order (newest occurred_at/source_sequence
        first).
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - transactions
      security:
