        annualization_factor:
          type: integer
          readOnly: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EngineWarning'
          readOnly: true
      required:
      - annualization_factor
      - downside_deviation
      - minimum_acceptable_return_annual
      - minimum_acceptable_return_daily
      - observations
      - value
      - warnings
    SourceEnum:
      enum:
      - CURRENT_VALUATION
      - DAILY_PERFORMANCE
      - ANALYTICS
      type: string
      description: |-
        * `CURRENT_VALUATION` - CURRENT_VALUATION
        * `DAILY_PERFORMANCE` - DAILY_PERFORMANCE
        * `ANALYTICS` - ANALYTICS
    StatusEnum:
      enum:
      - SUCCEEDED
      - NOT_FOUND
      - NO_DATA
      - FAILED
      type: string
      description: |-
        * `SUCCEEDED` - SUCCEEDED
        * `NOT_FOUND` - NOT_FOUND
        * `NO_DATA` - NO_DATA
        * `FAILED` - FAILED
    UnavailableReasonEnum:
      enum:
      - CURRENT_VALUATION_INCOMPLETE
      - CURRENT_ALLOCATION_UNAVAILABLE
      type: string
      description: |-
        * `CURRENT_VALUATION_INCOMPLETE` - CURRENT_VALUATION_INCOMPLETE
        * `CURRENT_ALLOCATION_UNAVAILABLE` - CURRENT_ALLOCATION_UNAVAILABLE
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
