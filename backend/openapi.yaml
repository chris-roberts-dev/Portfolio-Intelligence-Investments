components:
  schemas:
    AnalyticalResultProvenance:
      type: object
      description: Public analytical provenance envelope required by Section 8.8.
      properties:
        engine_version:
          type: string
          readOnly: true
        as_of_date:
          type: string
          format: date
          readOnly: true
        period_start:
          type: string
          format: date
          readOnly: true
        period_end:
          type: string
          format: date
          readOnly: true
        data_source:
          type: string
          readOnly: true
        price_field:
          type: string
          readOnly: true
        annualization_factor:
          type: number
          format: double
          readOnly: true
        benchmark:
          type: string
          readOnly: true
          nullable: true
        assumptions:
          type: array
          items:
            type: string
          readOnly: true
        warnings:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - annualization_factor
      - as_of_date
      - assumptions
      - benchmark
      - data_source
      - engine_version
      - period_end
      - period_start
      - price_field
      - warnings
    AnnualizedReturnResult:
      type: object
      description: CAGR / annualized geometric-return result.
      properties:
        value:
          type: number
          format: double
          readOnly: true
        wealth_ratio:
          type: number
          format: double
          readOnly: true
        elapsed_days:
          type: integer
          readOnly: true
        elapsed_years:
          type: number
          format: double
          readOnly: true
        is_short_period:
          type: boolean
          readOnly: true
      required:
      - elapsed_days
      - elapsed_years
      - is_short_period
      - value
      - wealth_ratio
    AssetCatalogItem:
      type: object
      description: Canonical active asset identity available for transaction entry.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        symbol:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        asset_type:
          type: string
          readOnly: true
        exchange:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
      required:
      - asset_type
      - currency
      - exchange
      - id
      - name
      - symbol
    AssetResolveOutcome:
      type: object
      description: One ordered canonical asset-resolution outcome.
      properties:
        symbol:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AssetResolveOutcomeStatusEnum'
          readOnly: true
        asset:
          allOf:
          - $ref: '#/components/schemas/AssetCatalogItem'
          readOnly: true
          nullable: true
        warning:
          type: string
          readOnly: true
          nullable: true
      required:
      - asset
      - status
      - symbol
      - warning
    AssetResolveOutcomeStatusEnum:
      enum:
      - RESOLVED
      - NOT_FOUND
      - FAILED
      type: string
      description: |-
        * `RESOLVED` - RESOLVED
        * `NOT_FOUND` - NOT_FOUND
        * `FAILED` - FAILED
    AssetResolveRequest:
      type: object
      description: Resolve/discover user-entered symbols into canonical application
        assets.
      properties:
        symbols:
          type: array
          items:
            type: string
            maxLength: 32
          maxItems: 50
      required:
      - symbols
    AssetResolveResult:
      type: object
      description: Provider-neutral asset discovery response for Allocation Lab input.
      properties:
        provider:
          type: string
          readOnly: true
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/AssetResolveOutcome'
          readOnly: true
      required:
      - outcomes
      - provider
    AuthApiError:
      type: object
      description: Stable authentication/session error response.
      properties:
        code:
          type: string
          readOnly: true
        detail:
          type: string
          readOnly: true
      required:
      - code
      - detail
    AuthSessionResult:
      type: object
      description: Current browser-session authentication state.
      properties:
        authenticated:
          type: boolean
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/AuthenticatedUser'
          readOnly: true
          nullable: true
      required:
      - authenticated
      - user
    AuthValidationError:
      type: object
      description: Stable authentication request validation error response.
      properties:
        code:
          type: string
          readOnly: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          readOnly: true
      required:
      - code
      - errors
    AuthenticatedUser:
      type: object
      description: Safe current-user fields only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
    BenchmarkPerformancePoint:
      type: object
      description: One exact-date benchmark point; gaps remain explicit nulls.
      properties:
        observation_date:
          type: string
          format: date
          readOnly: true
        adjusted_close:
          type: string
          readOnly: true
          nullable: true
        cumulative_return:
          type: number
          format: double
          readOnly: true
          nullable: true
        data_quality:
          allOf:
          - $ref: '#/components/schemas/PerformanceDataQualityEnum'
          readOnly: true
      required:
      - adjusted_close
      - cumulative_return
      - data_quality
      - observation_date
    BetaResult:
      type: object
      description: Benchmark beta with aligned observation count and warnings.
      properties:
        value:
          type: number
          format: double
          readOnly: true
          nullable: true
        observations:
          type: integer
          readOnly: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EngineWarning'
          readOnly: true
      required:
      - observations
      - value
      - warnings
    CategoryEnum:
      enum:
      - MARKET_DATA
      - DATA_COVERAGE
      - PROVIDER
      - VALUATION
      - ANALYTICS
      type: string
      description: |-
        * `MARKET_DATA` - MARKET_DATA
        * `DATA_COVERAGE` - DATA_COVERAGE
        * `PROVIDER` - PROVIDER
        * `VALUATION` - VALUATION
        * `ANALYTICS` - ANALYTICS
    ConcentrationResult:
      type: object
      description: Canonical current portfolio concentration measures.
      properties:
        largest_position_weight:
          type: number
          format: double
          readOnly: true
          nullable: true
        herfindahl_hirschman_index:
          type: number
          format: double
          readOnly: true
        security_position_count:
          type: integer
          readOnly: true
        cash_weight:
          type: number
          format: double
          readOnly: true
        largest_position_includes_cash:
          type: boolean
          readOnly: true
        hhi_includes_cash:
          type: boolean
          readOnly: true
        long_only:
          type: boolean
          readOnly: true
        weight_sum_tolerance:
          type: number
          format: double
          readOnly: true
      required:
      - cash_weight
      - herfindahl_hirschman_index
      - hhi_includes_cash
      - largest_position_includes_cash
      - largest_position_weight
      - long_only
      - security_position_count
      - weight_sum_tolerance
    CorrelationResult:
      type: object
      description: Benchmark Pearson correlation with aligned observation count.
      properties:
        value:
          type: number
          format: double
          readOnly: true
          nullable: true
        observations:
          type: integer
          readOnly: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EngineWarning'
          readOnly: true
      required:
      - observations
      - value
      - warnings
    CurrentHolding:
