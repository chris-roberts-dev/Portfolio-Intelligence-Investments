openapi: 3.0.3
info:
  title: Portfolio Intelligence API
  version: 0.1.0
paths:
  /api/v1/analytics/portfolios/{portfolio_id}/:
    get:
      operationId: portfolio_analytics
      description: Return owned-portfolio performance/risk analytics for an inclusive-start,
        exclusive-end trading-session period.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: minimum_acceptable_return_annual
        schema:
          type: number
          format: double
          default: 0.0
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: risk_free_rate_annual
        schema:
          type: number
          format: double
          default: 0.0
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - analytics
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioAnalyticsResult'
          description: Owned-portfolio analytical result and provenance.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Query or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider or analytics dependency is unavailable.
  /api/v1/health/:
    get:
      operationId: health_check
      description: Return a lightweight application-health response.
      tags:
      - system
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/v1/market-data/bars/query/:
    post:
      operationId: market_data_bars_query
      description: Resolve symbols and return bounded canonical daily market bars.
      tags:
      - market-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketBarQuery'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarketBarQuery'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarketBarQuery'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBarBatchResult'
          description: The provider completed the request. Inspect each ordered symbol
            result for SUCCEEDED, NOT_FOUND, NO_DATA, or FAILED.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBarValidationError'
          description: Request or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBarApiError'
          description: The authenticated user is not authorized to request the selected
            non-default provider.
        '429':
          description: The market-bar query throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBarApiError'
          description: The configured provider was unavailable or could not be attempted.
  /api/v1/portfolios/:
    get:
      operationId: portfolio_list
      description: List portfolios owned by the authenticated user.
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioSummary'
          description: Owned portfolio summaries.
  /api/v1/portfolios/{portfolio_id}/:
    get:
      operationId: portfolio_detail
      description: Return one portfolio owned by the authenticated user.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
          description: Owned portfolio summary.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
  /api/v1/portfolios/{portfolio_id}/allocation/:
    get:
      operationId: portfolio_dashboard_allocation
      description: Return the P0 current portfolio asset-class allocation using authoritative
        valuation/allocation weights, explicit cash, deterministic ordering, and disclosed
        grouping rules.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAllocationResult'
          description: Dashboard-ready current allocation.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider, calendar, valuation, or allocation dependency
            failed.
  /api/v1/portfolios/{portfolio_id}/holdings/:
    get:
      operationId: portfolio_current_holdings
      description: Return ledger-derived current holdings, raw-close valuation, allocation,
        warnings, and provenance for an owned portfolio.
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPortfolioHoldings'
          description: Current holdings and valuation result.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Query or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider or valuation dependency is unavailable.
  /api/v1/portfolios/{portfolio_id}/holdings/dashboard/:
    get:
      operationId: portfolio_dashboard_holdings
      description: Return display-ready current holdings with exact-date selected-period
        adjusted-close movement and non-interpolated sparkline points.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardHoldingsResult'
          description: Dashboard-ready owned-portfolio holdings.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Date-range or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider, calendar, valuation, or history dependency
            failed.
  /api/v1/portfolios/{portfolio_id}/movers/:
    get:
      operationId: portfolio_dashboard_movers
      description: Return deterministic selected-period Top Gainers, Top Losers, Largest
        Contributors, and Largest Detractors. Contribution rankings reconcile to canonical
        portfolio TWR and include explicit residual attribution metadata.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 5
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMoversResult'
          description: Dashboard-ready mover and contribution rankings.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Date-range, limit, or provider validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider, calendar, valuation, history, or attribution
            dependency failed.
  /api/v1/portfolios/{portfolio_id}/performance/:
    get:
      operationId: portfolio_performance
      description: Return display-ready daily portfolio value/TWR points and an optional
        exact-date benchmark series for an inclusive-start/exclusive-end period.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPerformanceResult'
          description: Display-ready portfolio performance series and provenance.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Date-range or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider, calendar, or performance dependency failed.
  /api/v1/portfolios/{portfolio_id}/review-items/:
    get:
      operationId: portfolio_dashboard_review_items
      description: Return stable owner-scoped data-quality and analytical review counts
        plus optionally filtered drill-down items.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: severity
        schema:
          type: string
          minLength: 1
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardReviewItemsResult'
          description: Dashboard data-quality review items.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Range, filter, or provider validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider, calendar, valuation, historical, or analytical
            dependency failed.
  /api/v1/portfolios/{portfolio_id}/summary/:
    get:
      operationId: portfolio_dashboard_summary
      description: Return the P0 current portfolio accounting summary using exact
        Decimal ledger arithmetic and weighted-average analytical book cost.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        required: true
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: provider
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: start
        schema:
          type: string
          format: date
        required: true
      tags:
      - portfolios
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPortfolioSummaryResult'
          description: Dashboard-ready accounting and valuation summary.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValidationError'
          description: Date-range or provider-selection validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The selected non-default provider is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: The portfolio does not exist in the authenticated user's scope.
        '429':
          description: The provider-backed read throttle was exceeded.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioApiError'
          description: A required provider, calendar, valuation, or accounting dependency
            failed.
  /api/v1/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AnalyticalResultProvenance:
      type: object
      description: Public analytical provenance envelope required by Section 8.8.
      properties:
        engine_version:
          type: string
          readOnly: true
        as_of_date:
          type: string
          format: date
          readOnly: true
        period_start:
          type: string
          format: date
          readOnly: true
        period_end:
          type: string
          format: date
          readOnly: true
        data_source:
          type: string
          readOnly: true
        price_field:
          type: string
          readOnly: true
        annualization_factor:
          type: number
          format: double
          readOnly: true
        benchmark:
          type: string
          readOnly: true
          nullable: true
        assumptions:
          type: array
          items:
            type: string
          readOnly: true
        warnings:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - annualization_factor
      - as_of_date
      - assumptions
      - benchmark
      - data_source
      - engine_version
      - period_end
      - period_start
      - price_field
      - warnings
    AnnualizedReturnResult:
      type: object
      description: CAGR / annualized geometric-return result.
      properties:
        value:
          type: number
          format: double
          readOnly: true
        wealth_ratio:
          type: number
          format: double
          readOnly: true
        elapsed_days:
          type: integer
          readOnly: true
        elapsed_years:
          type: number
          format: double
          readOnly: true
        is_short_period:
          type: boolean
          readOnly: true
      required:
      - elapsed_days
      - elapsed_years
      - is_short_period
      - value
      - wealth_ratio
    BenchmarkPerformancePoint:
      type: object
      description: One exact-date benchmark point; gaps remain explicit nulls.
      properties:
        observation_date:
          type: string
          format: date
          readOnly: true
        adjusted_close:
          type: string
          readOnly: true
          nullable: true
        cumulative_return:
          type: number
          format: double
          readOnly: true
          nullable: true
        data_quality:
          allOf:
          - $ref: '#/components/schemas/PerformanceDataQualityEnum'
          readOnly: true
      required:
      - adjusted_close
      - cumulative_return
      - data_quality
      - observation_date
    BetaResult:
      type: object
      description: Benchmark beta with aligned observation count and warnings.
      properties:
        value:
          type: number
          format: double
          readOnly: true
          nullable: true
        observations:
          type: integer
          readOnly: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EngineWarning'
          readOnly: true
      required:
      - observations
      - value
      - warnings
    CategoryEnum:
      enum:
      - MARKET_DATA
      - DATA_COVERAGE
      - PROVIDER
      - VALUATION
      - ANALYTICS
      type: string
      description: |-
        * `MARKET_DATA` - MARKET_DATA
        * `DATA_COVERAGE` - DATA_COVERAGE
        * `PROVIDER` - PROVIDER
        * `VALUATION` - VALUATION
        * `ANALYTICS` - ANALYTICS
    ConcentrationResult:
      type: object
      description: Canonical current portfolio concentration measures.
      properties:
        largest_position_weight:
          type: number
          format: double
          readOnly: true
          nullable: true
        herfindahl_hirschman_index:
          type: number
          format: double
          readOnly: true
        security_position_count:
          type: integer
          readOnly: true
        cash_weight:
          type: number
          format: double
          readOnly: true
        largest_position_includes_cash:
          type: boolean
          readOnly: true
        hhi_includes_cash:
          type: boolean
          readOnly: true
        long_only:
          type: boolean
          readOnly: true
        weight_sum_tolerance:
          type: number
          format: double
          readOnly: true
      required:
      - cash_weight
      - herfindahl_hirschman_index
      - hhi_includes_cash
      - largest_position_includes_cash
      - largest_position_weight
      - long_only
      - security_position_count
      - weight_sum_tolerance
    CurrentHolding:
      type: object
      description: One current ledger-derived holding with its accepted raw-close
        price.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        symbol:
          type: string
          readOnly: true
        quantity:
          type: string
          readOnly: true
        trade_date:
          type: string
          format: date
          readOnly: true
        raw_close:
          type: string
          readOnly: true
        market_value:
          type: string
          description: Return exact Decimal position market value without float conversion.
          readOnly: true
        stale_trading_sessions:
          type: integer
          readOnly: true
      required:
      - asset_id
      - market_value
      - quantity
      - raw_close
      - stale_trading_sessions
      - symbol
      - trade_date
    CurrentPortfolioHoldings:
      type: object
      description: Read-only current holdings, value, allocation, and valuation provenance.
      properties:
        portfolio_id:
