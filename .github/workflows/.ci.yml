name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: portfolio_intelligence
          POSTGRES_USER: portfolio_intelligence
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_intelligence -d portfolio_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-django-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DEBUG: "false"
      POSTGRES_DB: portfolio_intelligence
      POSTGRES_USER: portfolio_intelligence
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen --all-groups

      - name: Check backend formatting
        run: uv run ruff format --check .

      - name: Lint backend
        run: uv run ruff check .

      - name: Type-check backend
        run: uv run mypy

      - name: Run Django system check
        run: uv run python manage.py check --settings=config.settings.dev

      - name: Check migration drift
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.dev

      - name: Apply PostgreSQL migrations
        run: uv run python manage.py migrate --noinput --settings=config.settings.dev

      - name: Verify migrations are fully applied
        run: uv run python manage.py migrate --check --settings=config.settings.dev

      - name: Run backend tests
        run: uv run pytest -q

      - name: Regenerate and validate OpenAPI contract
        run: >-
          uv run python manage.py spectacular
          --validate
          --file openapi.yaml
          --settings=config.settings.dev

      - name: Check OpenAPI contract drift
        run: git diff --exit-code -- openapi.yaml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build